# CI/CD Security Pipeline: SAST + SCA + security-тесты API + WAF-as-code + DAST по OpenAPI
# Любая найденная уязвимость уровня HIGH/CRITICAL (ERROR в Semgrep) останавливает сборку.
name: security-pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"      # еженедельно: новые CVE публикуются и без изменений кода
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ 1. Секреты
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0               # проверяется вся история коммитов
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            git /repo --redact --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: gitleaks-report, path: gitleaks.sarif }

  # ------------------------------------------------------------------ 2. SAST
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write          # загрузка SARIF в Security → Code scanning
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config .semgrep/rules.yml \
            --config p/python --config p/flask --config p/owasp-top-ten --config p/secrets \
            --metrics off \
            --sarif --output semgrep.sarif \
            --json-output semgrep.json \
            --severity ERROR --error \
            src
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: semgrep.sarif, category: semgrep }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: semgrep-report, path: "semgrep.*" }

  sast-bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install "bandit[sarif]==1.8.6"
      - name: Bandit (gate — medium и выше)
        run: |
          bandit -r src -f sarif -o bandit.sarif --exit-zero
          bandit -r src --severity-level medium --confidence-level medium
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: bandit.sarif, category: bandit }

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with: { category: codeql }

  # ------------------------------------------------------------------ 3. SCA
  sca-pip-audit:
    name: SCA (pip-audit + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pip-audit==2.9.0
      - name: SBOM (CycloneDX)
        run: pip-audit -r requirements.txt --no-deps --disable-pip -f cyclonedx-json -o sbom.cdx.json || true
      - name: pip-audit (gate — любая известная уязвимость)
        run: pip-audit -r requirements.txt --no-deps --disable-pip --desc on
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: sbom, path: sbom.cdx.json }

  sca-trivy:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Trivy — отчёт SARIF (все уровни)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: trivy.sarif, category: trivy }
      - name: Trivy — gate (HIGH/CRITICAL с доступным исправлением)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  dependency-review:
    name: SCA (Dependency Review, только PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # ------------------------------------------------------------------ 4. Тесты
  security-tests:
    name: Security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -v tests

  # ------------------------------------------------------------------ 5. DAST по спецификации OpenAPI
  dast-zap-api:
    name: DAST (OWASP ZAP API scan, OpenAPI)
    needs: [sast-semgrep, sast-bandit, sca-pip-audit, sca-trivy, security-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Запуск API
        run: |
          SHOP_SECRET_KEY=$(openssl rand -hex 32)
          export SHOP_SECRET_KEY
          pip install -r requirements.txt
          nohup python -m src.shop.app > app.log 2>&1 &
          timeout 30 sh -c 'until curl -sf http://127.0.0.1:5000/api/v1/products >/dev/null; do sleep 1; done'
      - name: ZAP API scan
        run: |
          chmod a+w .
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" zaproxy/zap-stable \
            zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi -O http://127.0.0.1:5000 \
            -c zap-api-rules.tsv -r zap-api.html -J zap-api.json -I
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: zap-api-report, path: "zap-api.*" }
