# Обратный прокси Nginx + ModSecurity v3 перед ENU Lab Shop API (методические указания, часть 1)
server {
    listen 80;
    server_name api.local;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    access_log /var/log/nginx/api.local.access.log;
    error_log  /var/log/nginx/api.local.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:5000;            # тестовое API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
