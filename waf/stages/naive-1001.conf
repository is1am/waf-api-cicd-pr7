# Этап «наивное правило»: правило 1001 ровно в редакции методических указаний (deny).
# Используется только для эксперимента с ложными срабатываниями (раздел 6.2 отчёта).
SecAction "id:1000,phase:1,pass,nolog,t:none,\
    setvar:'tx.allowed_methods=|GET| |HEAD| |POST| |PUT| |PATCH| |DELETE| |OPTIONS|'"

SecRule REQUEST_URI "@rx /api/v1/users/[0-9]+/.*" \
    "id:1001,\
    phase:2,\
    deny,\
    status:403,\
    msg:'Potential BOLA attempt detected',\
    tag:'API_SECURITY'"
