# Главный файл правил ModSecurity (подключается директивой modsecurity_rules_file).
# Порядок важен: базовая конфигурация → настройка CRS → правила проекта (before-crs) → правила CRS.
Include /etc/nginx/modsec/modsecurity.conf
Include /etc/nginx/modsec/crs/crs-setup.conf
Include /etc/nginx/modsec/custom/*.conf
Include /etc/nginx/modsec/crs/rules/*.conf
