# Конфигурация Gitleaks: стандартные правила + исключение для артефактов лабораторных прогонов.
# В evidence/ лежат HTTP-дампы и отчёты сканеров учебного стенда: JWT, выданные локальным
# Juice Shop и ENU Lab Shop (секрет подписи генерировался случайно на каждый запуск, токены
# истекли), и вывод самих сканеров с замаскированными находками. Реальных секретов там нет.
# Исключение ограничено каталогом evidence/ — код (src/), конфигурации и CI проверяются полностью.
title = "ENU Lab Shop gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Артефакты лабораторных прогонов (токены локального стенда, отчёты сканеров)"
paths = ['''^evidence/''']
