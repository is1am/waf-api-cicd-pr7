# =====================================================================================
#  Пользовательские правила ModSecurity v3 для защиты ENU Lab Shop API v1
#  (подключаются ДО правил OWASP CRS — файл before-crs).
#  Диапазон ID 1000–1099 зарезервирован под правила проекта.
#  Категории: OWASP API Security Top 10 (2023) — API1 (BOLA), API3 (Mass Assignment).
# =====================================================================================

# ------------------------------------------------------------------ 1000. Настройка CRS для REST API
# По умолчанию CRS разрешает только GET HEAD POST OPTIONS (правило 911100) —
# PATCH/PUT/DELETE легитимного REST API блокировались бы как «ложное срабатывание».
# Формат CRS v4 — каждый метод в вертикальных чертах (|GET| |POST| ...).
SecAction "id:1000,phase:1,pass,nolog,t:none,\
    setvar:'tx.allowed_methods=|GET| |HEAD| |POST| |PUT| |PATCH| |DELETE| |OPTIONS|'"

# ------------------------------------------------------------------ 1001. Правило из методических указаний
# Исходный вариант (deny для любого /api/v1/users/<id>/...) блокирует и владельца объекта —
# 100 % ложных срабатываний (см. отчёт, раздел 6.2). Оставлен в режиме обнаружения:
# только запись в журнал аудита, без блокировки — как индикатор перебора.
SecRule REQUEST_URI "@rx /api/v1/users/[0-9]+/.*" \
    "id:1001,\
    phase:1,\
    pass,\
    log,\
    t:none,\
    msg:'Potential BOLA attempt detected (detection only)',\
    severity:'NOTICE',\
    tag:'API_SECURITY',\
    tag:'OWASP_API1_2023'"

# ------------------------------------------------------------------ 1002–1006. API1:2023 BOLA — объектная проверка
# Идентификатор объекта из пути сравнивается с subject (sub) из JWT.
# Путь берётся из REQUEST_FILENAME с URL-декодированием и нормализацией —
# иначе обход через /api/v1/users/%31%30%32/profile (см. раздел 6.3).
SecRule REQUEST_FILENAME "@rx ^/api/v1/users/([^/]+)(?:/|$)" \
    "id:1002,phase:1,pass,nolog,capture,\
    t:none,t:urlDecodeUni,t:normalizePath,\
    setvar:'tx.api_object_uid=%{TX.1}'"

# Полезная нагрузка JWT (2-й сегмент, base64url) — подпись проверяет само приложение,
# WAF только читает заявки. Поддельный токен всё равно будет отклонён API с кодом 401.
SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+[A-Za-z0-9_-]+\.([A-Za-z0-9_-]+)\." \
    "id:1003,phase:1,pass,nolog,capture,t:none,\
    setvar:'tx.api_jwt_payload=%{TX.1}'"

SecRule TX:api_jwt_payload "@rx \x22sub\x22\s*:\s*\x22?([0-9]+)" \
    "id:1004,phase:1,pass,nolog,capture,t:none,t:base64DecodeExt,\
    setvar:'tx.api_jwt_sub=%{TX.1}'"

SecRule TX:api_jwt_payload "@rx \x22role\x22\s*:\s*\x22admin\x22" \
    "id:1005,phase:1,pass,nolog,t:none,t:base64DecodeExt,\
    setvar:'tx.api_jwt_admin=1'"

SecRule TX:api_object_uid "!@streq %{tx.api_jwt_sub}" \
    "id:1006,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'BOLA: object id does not match token subject',\
    logdata:'object=%{tx.api_object_uid} subject=%{tx.api_jwt_sub} uri=%{REQUEST_URI}',\
    severity:'CRITICAL',\
    tag:'API_SECURITY',\
    tag:'OWASP_API1_2023',\
    chain"
    SecRule &TX:api_jwt_sub "@eq 1" "chain"
        SecRule &TX:api_jwt_admin "@eq 0" "t:none"

# ------------------------------------------------------------------ 1007. API1 — перебор идентификаторов
# Объекты без владельца в URL (заказы) WAF проверить не может — ограничиваем частоту
# обращений к ним: не более 10 разных запросов /orders/<id> за 60 с с одного IP.
SecAction "id:1007,phase:1,pass,nolog,t:none,initcol:ip=%{REMOTE_ADDR}"
SecRule REQUEST_FILENAME "@rx ^/api/v1/orders/[0-9]+$" \
    "id:1008,phase:1,pass,nolog,t:none,t:urlDecodeUni,\
    setvar:'ip.api_order_reads=+1',expirevar:'ip.api_order_reads=60'"
SecRule REQUEST_FILENAME "@rx ^/api/v1/orders/" \
    "id:1009,\
    phase:1,\
    deny,\
    status:429,\
    log,\
    t:none,\
    msg:'BOLA: object id enumeration (rate limit exceeded)',\
    logdata:'reads_per_60s=%{ip.api_order_reads}',\
    severity:'WARNING',\
    tag:'API_SECURITY',\
    tag:'OWASP_API1_2023',\
    chain"
    SecRule IP:api_order_reads "@gt 10" "t:none"

# ------------------------------------------------------------------ 1010. API3:2023 — привилегированные свойства
# Тело JSON разбирается процессором JSON (правило 200001 modsecurity.conf),
# имена полей доступны как ARGS_NAMES вида json.role, json.is_admin
# (в libmodsecurity 3.0.12 коллекция ARGS_POST_NAMES для JSON не заполняется — проверено на стенде).
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" \
    "id:1010,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'Mass Assignment: privileged property in request body',\
    logdata:'property=%{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'API_SECURITY',\
    tag:'OWASP_API3_2023',\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/api/v1/(?:register|users/[^/]+/profile)$" "t:none,t:urlDecodeUni,chain"
        SecRule ARGS_NAMES "@rx (?i)^json\.(?:role|is_?admin|admin|balance|id|iin|card_last4|permissions?|groups?)$" "t:none"

# ------------------------------------------------------------------ 1011–1012. API3 — позитивная модель (схема полей)
# Разрешены только поля из спецификации OpenAPI (additionalProperties: false).
SecRule REQUEST_FILENAME "@streq /api/v1/register" \
    "id:1011,phase:2,deny,status:403,log,t:none,\
    msg:'Schema violation: unexpected property in /register',\
    logdata:'property=%{MATCHED_VAR_NAME}',\
    severity:'ERROR',tag:'API_SECURITY',tag:'OWASP_API3_2023',\
    chain"
    SecRule ARGS_NAMES "!@rx ^json\.(?:username|password|full_name|email|phone)$" "t:none"

SecRule REQUEST_FILENAME "@rx ^/api/v1/users/[^/]+/profile$" \
    "id:1012,phase:2,deny,status:403,log,t:none,t:urlDecodeUni,\
    msg:'Schema violation: unexpected property in profile update',\
    logdata:'property=%{MATCHED_VAR_NAME}',\
    severity:'ERROR',tag:'API_SECURITY',tag:'OWASP_API3_2023',\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:PUT|PATCH)$" "chain"
        SecRule ARGS_NAMES "!@rx ^json\.(?:full_name|email|phone)$" "t:none"

# ------------------------------------------------------------------ 1013. Только JSON для изменяющих запросов
# Тело другого типа не разбирается процессором JSON → правила 1010–1012 его не видят.
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" \
    "id:1013,phase:1,deny,status:415,log,t:none,\
    msg:'Unsupported Content-Type for API write request',\
    logdata:'content-type=%{REQUEST_HEADERS.Content-Type}',\
    severity:'WARNING',tag:'API_SECURITY',\
    chain"
    SecRule REQUEST_FILENAME "@beginsWith /api/v1/" "chain"
        SecRule REQUEST_HEADERS:Content-Type "!@rx (?i)^application/(?:[a-z0-9.-]+\+)?json(?:\s*;.*)?$" "t:none"
